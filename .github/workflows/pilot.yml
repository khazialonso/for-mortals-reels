name: pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pilot/**"
      - ".github/workflows/pilot.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install requests
          npm i -g hyperframes
      - name: Build composition
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          cd pilot && python build.py
          cd reel && printf '{"paths":{"assets":"assets"}}' > hyperframes.json
          hyperframes lint . || true
      - name: Render
        run: |
          cd pilot/reel && hyperframes render . -o ../pilot_ai.mp4 -q delivery
          ffprobe -v error -show_entries format=duration -of csv=p=0 ../pilot_ai.mp4
          hyperframes snapshot . || true
      - name: Publish to branch pilot-output
        run: |
          mkdir -p /tmp/out && cp pilot/pilot_ai.mp4 pilot/reel/index.html /tmp/out/
          cp pilot/reel/.hyperframes/artifacts/snapshots/*/*.png /tmp/out/ || true
          cd /tmp/out && git init -q -b pilot-output && git add -A
          git -c user.name=reels-bot -c user.email=reels-bot@users.noreply.github.com commit -q -m "pilot output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pilot-output
