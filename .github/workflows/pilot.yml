name: pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pilot/**"
      - ".github/workflows/pilot.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install requests
          npm i -g hyperframes
      - name: Build composition
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          cd pilot && python build.py
          cd reel && printf '{"paths":{"assets":"assets"}}' > hyperframes.json
          hyperframes lint . || true
      - name: Render
        run: |
          cd pilot/reel && hyperframes render . -o ../pilot_ai.mp4 -q delivery
          ffprobe -v error -show_entries format=duration -of csv=p=0 ../pilot_ai.mp4
          hyperframes snapshot . || true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pilot -y --cleanup-tag || true
          cd pilot && zip -j snaps.zip reel/.hyperframes/artifacts/snapshots/*/*.png || true
          for i in 1 2 3 4; do
            gh release create pilot pilot_ai.mp4 reel/index.html snaps.zip --title "Пилот новой сборки" --notes "тестовый ролик, не для публикации" && break
            sleep 10; gh release delete pilot -y --cleanup-tag || true
          done
