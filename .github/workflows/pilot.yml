name: pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pilot/**"
      - ".github/workflows/pilot.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install requests
          npm i -g hyperframes
          hyperframes --version || true
          hyperframes --help || true
          hyperframes render --help || true
          hyperframes init --help || true
          hyperframes lint --help || true
