name: pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pilot/**"
      - ".github/workflows/pilot.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install requests
          npm i -g hyperframes
          hyperframes doctor || true
      - name: Explore
        run: |
          hyperframes init demo --example blank --resolution portrait --non-interactive --skip-skills --skip-transcribe
          cd demo && find . -type f -not -path "*/node_modules/*" | head -50
          for f in index.html hyperframes.json package.json; do echo "=== $f"; cat $f 2>/dev/null; done
          hyperframes docs || true
          hyperframes docs gsap || true
          hyperframes docs composition || true
          hyperframes render -o ../demo.mp4 -q draft && ls -la ../demo.mp4
