name: build-reels

on:
  schedule:
    - cron: "40 4 * * *"   # 11:40 по Самуи, после агента REELS (11:17)
    - cron: "40 7 * * *"   # 14:40 по Самуи, повтор на случай сбоя
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-reels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg and font
        run: |
          mkdir -p "$HOME/bin" fonts
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ff.tar.xz \
              && tar -xf ff.tar.xz && cp ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe "$HOME/bin/" \
              || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 -o fonts/Montserrat-ExtraBold.ttf \
            https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-ExtraBold.ttf || true
          [ "$(stat -c%s fonts/Montserrat-ExtraBold.ttf 2>/dev/null || echo 0)" -gt 50000 ] || rm -f fonts/Montserrat-ExtraBold.ttf

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Build reels
        env:
          REELS_WEBAPP_URL: ${{ secrets.REELS_WEBAPP_URL }}
          REELS_KEY: ${{ secrets.REELS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python build.py

      - name: Save build log
        if: always()
        run: |
          if [ -n "$(git status --porcelain log)" ]; then
            git config user.name "reels-bot"
            git config user.email "reels-bot@users.noreply.github.com"
            git add log
            git commit -m "build log $(date -u +%F)"
            git push
          fi
